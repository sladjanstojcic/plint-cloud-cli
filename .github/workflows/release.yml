# Publishes a GitHub Release when a version tag is pushed: git tag v0.1.0 && git push origin v0.1.0
# install.sh downloads releases/latest/download/plint.tar.gz from here.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # no dependency cache for release builds (cache-poisoning risk)
          package-manager-cache: false
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Checksum
        working-directory: dist
        run: sha256sum plint.tar.gz > plint.tar.gz.sha256
      - name: Smoke-test the built tarball through install.sh
        run: |
          export HOME="$(mktemp -d)"
          PLINT_RELEASE_URL="file://$PWD/dist/plint.tar.gz" sh install.sh
          "$HOME/.plint/bin/plint" --version
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/plint.tar.gz dist/plint.tar.gz.sha256 install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes
